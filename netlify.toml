[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  included_files = ["public/data/**"]

[[redirects]]
  from = "/verse/:version/:book/:chapter/:verse"
  to = "/.netlify/functions/verse-meta?version=:version&book=:book&chapter=:chapter&verse=:verse"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
