[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  included_files = ["public/data/**"]

# ── Seguridad: headers por defecto para todo el sitio ────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.clarity.ms; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.googletagmanager.com https://*.clarity.ms; font-src 'self'; connect-src 'self' https://robible-api.robible.workers.dev https://www.google-analytics.com https://*.clarity.ms https://*.google-analytics.com; frame-ancestors 'none'"

# ── Rate limiting: bloquear exceso de peticiones por IP ───────────────────────
# Netlify Plus: permite rate limiting por IP
# Si no tienes Plus, estas reglas se aplican en capa de CDN via _headers
[[headers]]
  for = "/data/*"
  [headers.values]
    # Cache largo: el SW se encarga de invalidar
    Cache-Control = "public, max-age=31536000, immutable"
    X-Robots-Tag = "noai, noimageai"
    # Rate limit hint (funciona con Netlify Plus)
    X-RateLimit-Limit = "100"
    X-RateLimit-Window = "1 hour"
    # Bloquear que los datos se embedding en iframes externos
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/data/*/bible.map.json"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Robots-Tag = "noai, noimageai"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/lang/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── OG images: dinámicas, no cachear ─────────────────────────────────────────
[[headers]]
  for = "/.netlify/functions/og-image*"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=300"

# ── Redirects ─────────────────────────────────────────────────────────────────
[[redirects]]
  from = "/og/verse/:version/:book/:chapter/:verse.svg"
  to = "/.netlify/functions/og-image?version=:version&book=:book&chapter=:chapter&verse=:verse"
  status = 200

[[redirects]]
  from = "/verse/:version/:book/:chapter/:verse"
  to = "/.netlify/functions/verse-meta?version=:version&book=:book&chapter=:chapter&verse=:verse"
  status = 200

# Enlace a un versículo concreto.
#
# Antes esta forma la servía una página estática generada en el build: una por
# versículo y versión, unas 31.000 por Biblia. Se eliminaron porque hinchaban el
# despliegue y hacían que Googlebot recorriera decenas de miles de URLs casi
# idénticas, marcadas además como `noindex`.
#
# Ahora las etiquetas se generan al vuelo. Solo entra por aquí quien abre el
# enlace directamente (compartir, un rastreador); dentro de la aplicación la
# navegación entre versículos es del lado del cliente y no llega al servidor.
[[redirects]]
  from = "/biblia/:version/:book/:chapter/:verse"
  to = "/.netlify/functions/verse-meta?version=:version&book_slug=:book&chapter=:chapter&verse=:verse"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
