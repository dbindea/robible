<?xml version="1.0" encoding="UTF-8"?>
<!--
  RoBible — Logo fuente (source of truth)
  ─────────────────────────────────────────
  • Círculo teal (#2E7D9B) con libro blanco y cruz dorada (#D4A853).
  • Este SVG es la fuente única: a partir de él se generan
    favicon.svg, favicon.ico, apple-touch-icon, android-chrome y maskable.
  • Diseño 512x512 viewBox, escalable a cualquier tamaño.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background circle: teal blue (always same in light & dark) -->
  <circle cx="256" cy="256" r="240" fill="#2E7D9B"/>

  <!-- Open book: white in light mode, dark teal in dark mode -->
  <path d="M100 130 Q130 100 256 115 Q382 100 412 130"
        fill="none" stroke="#FFFFFF" stroke-width="12"
        stroke-linecap="round"/>
  <path d="M100 130 Q130 120 256 145 Q382 120 412 130 L412 340 Q382 330 256 355 Q130 330 100 340 Z"
        fill="none" stroke="#FFFFFF" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="256" y1="145" x2="256" y2="195" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  <line x1="256" y1="305" x2="256" y2="355" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  <path d="M100 340 Q130 370 256 355 Q382 370 412 340"
        fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>

  <!-- Solid gold cross, always gold -->
  <rect x="230" y="195" width="52" height="110" rx="8" fill="#D4A853"/>
  <rect x="202" y="220" width="108" height="52" rx="8" fill="#D4A853"/>
</svg>
