<?xml version="1.0" encoding="UTF-8"?>
<!--
  RoBible — Logo fuente (source of truth)
  ─────────────────────────────────────────
  Emblema circular con doble anillo, planta/llama de 3 hojas en el
  centro y pedestal con base.

  Paleta:
    Fondo teal:    #1f4a5c
    Acento cobre:  #d28456

  Diseño 512x512 viewBox, escalable a cualquier tamaño.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <style>
      .bg { fill: #1f4a5c; }
      .accent { fill: none; stroke: #d28456; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Fondo: cuadrado teal con esquinas redondeadas -->
  <rect class="bg" x="0" y="0" width="512" height="512" rx="96" ry="96"/>

  <!-- Anillo exterior (grosor 14) -->
  <circle class="accent" cx="256" cy="232" r="172" stroke-width="14"/>

  <!-- Anillo interior (grosor 11) -->
  <circle class="accent" cx="256" cy="232" r="126" stroke-width="11"/>

  <!-- Planta/llama: 3 hojas en forma de pétalo -->
  <g class="accent" stroke-width="13">
    <!-- Hoja central: pétalo con punta arriba, ancho máximo a la mitad -->
    <path d="M 256 100
             C 360 180, 360 280, 256 336
             C 152 280, 152 180, 256 100 Z"/>
    <!-- Detalle interior: llama mediana dentro de la central -->
    <path d="M 256 156
             C 312 200, 312 270, 256 312
             C 200 270, 200 200, 256 156 Z"/>

    <!-- Hoja izquierda: punta arriba-izquierda, base al centro -->
    <path d="M 124 148
             C 198 188, 232 280, 256 336
             C 200 268, 148 220, 124 148 Z"/>

    <!-- Hoja derecha: espejo de la izquierda -->
    <path d="M 388 148
             C 314 188, 280 280, 256 336
             C 312 268, 364 220, 388 148 Z"/>
  </g>

  <!-- Estante / bandeja horizontal: cruza los anillos a la altura de la base de la planta -->
  <line class="accent" x1="56" y1="336" x2="456" y2="336" stroke-width="14"/>

  <!-- Pedestal vertical corto: del estante a la base -->
  <line class="accent" x1="256" y1="336" x2="256" y2="420" stroke-width="14"/>

  <!-- Base horizontal del pedestal -->
  <line class="accent" x1="200" y1="420" x2="312" y2="420" stroke-width="14"/>
</svg>
