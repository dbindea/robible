<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="RoBible">
  <!--
    RoBible — emblema sin fondo.
    Mismo dibujo que logo.svg pero transparente, para colocarlo sobre una
    superficie propia (cabeceras, badges, documentos).

    Los colores son los de fondo claro: azul #2d96cd (blue 500) y verde
    #28a745 (green 500). Sobre fondo oscuro conviene logo.svg, que ya trae
    su cuadrado.
  -->
  <g fill="none" stroke="#2d96cd" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="256" cy="248" r="182" stroke-width="18"/>
    <circle cx="256" cy="248" r="150" stroke-width="6" opacity="0.45"/>

    <path d="M 250 300 C 218 288, 194 264, 184 234" stroke-width="14"/>
    <path d="M 262 300 C 294 288, 318 264, 328 234" stroke-width="14"/>

    <path d="M 158 330 H 354" stroke-width="16"/>
    <path d="M 256 330 V 388" stroke-width="16"/>
    <path d="M 210 388 H 302" stroke-width="16"/>
  </g>

  <path d="M 256 152
           C 280 190, 296 218, 296 248
           C 296 282, 278 302, 256 302
           C 234 302, 216 282, 216 248
           C 216 218, 232 190, 256 152 Z"
        fill="#28a745"/>
  <!-- El corazón se recorta con evenodd en vez de pintarse con el color del
       fondo: aquí no hay fondo conocido. -->
  <path d="M 256 202
           C 268 226, 274 238, 274 254
           C 274 272, 266 282, 256 282
           C 246 282, 238 272, 238 254
           C 238 238, 244 226, 256 202 Z"
        fill="#ffffff" opacity="0.32"/>
</svg>
