<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="RoBible">
  <!--
    RoBible — logo completo, con fondo.
    Para navbar, iconos PWA, og:image y cualquier sitio que necesite el
    cuadrado opaco.

    Emblema: anillo (lo eterno) + llama de tres lenguas (el Espíritu) que se
    alza sobre un atril (la Escritura).

    Paleta del sistema (public/global.css):
      fondo   #1d3040  (grey 800)
      trazo   #4db2e6  (blue 400)
      llama   #4ecb74  verde de "lectura", el mismo que resalta el versículo

    Todo el dibujo cabe en un radio de 192 px desde el centro, dentro de la
    zona segura de los iconos maskable (80 % del lienzo).
  -->
  <rect width="512" height="512" rx="96" ry="96" fill="#1d3040"/>

  <g fill="none" stroke="#4db2e6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Anillo exterior: el trazo grueso que define la marca -->
    <circle cx="256" cy="248" r="182" stroke-width="18"/>
    <!-- Anillo interior: fino y separado, acompaña sin competir -->
    <circle cx="256" cy="248" r="150" stroke-width="6" opacity="0.45"/>

    <!-- Lenguas laterales de la llama -->
    <path d="M 250 300 C 218 288, 194 264, 184 234" stroke-width="14"/>
    <path d="M 262 300 C 294 288, 318 264, 328 234" stroke-width="14"/>

    <!-- Atril: repisa, pie y base. Contenido dentro del anillo, para que no
         parezca que una línea tacha el logotipo. -->
    <path d="M 158 330 H 354" stroke-width="16"/>
    <path d="M 256 330 V 388" stroke-width="16"/>
    <path d="M 210 388 H 302" stroke-width="16"/>
  </g>

  <!-- Llama central: sólida, para que aguante a tamaños pequeños donde un
       contorno se cerraría sobre sí mismo. -->
  <path d="M 256 152
           C 280 190, 296 218, 296 248
           C 296 282, 278 302, 256 302
           C 234 302, 216 282, 216 248
           C 216 218, 232 190, 256 152 Z"
        fill="#4ecb74"/>
  <!-- Corazón de la llama: hueco del color del fondo, da profundidad -->
  <path d="M 256 202
           C 268 226, 274 238, 274 254
           C 274 272, 266 282, 256 282
           C 246 282, 238 272, 238 254
           C 238 238, 244 226, 256 202 Z"
        fill="#1d3040" opacity="0.55"/>
</svg>
