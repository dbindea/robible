<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style>
    .logo-book { fill: none; stroke: #FFFFFF; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
    .logo-spine { fill: none; stroke: #FFFFFF; stroke-width: 12; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) {
      .logo-book, .logo-spine { stroke: #1d3040; }
    }
  </style>

  <!-- Background circle: teal blue -->
  <circle cx="256" cy="256" r="240" fill="#2E7D9B"/>

  <!-- Open book: adapts via CSS for dark mode -->
  <path class="logo-book" d="M100 130 Q130 100 256 115 Q382 100 412 130"/>
  <path class="logo-book" d="M100 130 Q130 120 256 145 Q382 120 412 130 L412 340 Q382 330 256 355 Q130 330 100 340 Z"/>
  <line class="logo-spine" x1="256" y1="145" x2="256" y2="195"/>
  <line class="logo-spine" x1="256" y1="305" x2="256" y2="355"/>
  <path class="logo-book" d="M100 340 Q130 370 256 355 Q382 370 412 340"/>

  <!-- Solid gold cross, floating in center — always gold -->
  <rect x="230" y="195" width="52" height="110" rx="8" fill="#D4A853"/>
  <rect x="202" y="220" width="108" height="52" rx="8" fill="#D4A853"/>
</svg>
