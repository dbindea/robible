<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="RoBible">
  <!--
    RoBible — favicon.
    Versión SIMPLIFICADA a propósito: a 16 px el anillo interior, las lenguas
    laterales y el atril se empastan en una mancha. Aquí queda solo lo que
    identifica la marca y sobrevive a ese tamaño: el anillo y la llama.

    Los trazos son mucho más gruesos que en logo.svg (38 frente a 18) porque a
    16 px un trazo de 18/512 no llega a medio píxel y desaparece.

    Fondo transparente: se ve sobre pestañas claras y oscuras.
  -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#2d96cd" stroke-width="38"/>

  <path d="M 256 130
           C 292 186, 320 228, 320 272
           C 320 320, 292 352, 256 352
           C 220 352, 192 320, 192 272
           C 192 228, 220 186, 256 130 Z"
        fill="#28a745"/>
</svg>
